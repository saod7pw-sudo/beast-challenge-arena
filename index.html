<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090b14"><title>Beast Challenge Arena 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b14;color:white;font-family:Arial;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;padding:12px;gap:8px}.pill{background:#090d19dd;border:1px solid #ffffff44;border-radius:12px;padding:9px 12px;font-weight:bold}#title{position:absolute;top:65px;left:50%;transform:translateX(-50%);font-weight:1000;color:#ff344d;font-size:clamp(18px,4vw,32px);white-space:nowrap;text-shadow:0 0 20px red}#message{position:absolute;top:110px;left:50%;transform:translateX(-50%);background:#080b14dd;border:1px solid #ff334d88;border-radius:10px;padding:8px 12px;font-size:13px;white-space:nowrap}#bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#080b14cc;padding:8px 12px;border-radius:10px;font-size:12px;white-space:nowrap}#pad{position:absolute;left:20px;bottom:25px;width:112px;height:112px;border:2px solid #ffffff88;border-radius:50%;background:#ffffff22;pointer-events:auto;display:none}#stick{position:absolute;left:33px;top:33px;width:42px;height:42px;background:#ffffffbb;border-radius:50%}#jump{position:absolute;right:22px;bottom:40px;width:76px;height:76px;border-radius:50%;background:#ed2948;color:white;border:2px solid white;font-weight:bold;pointer-events:auto;display:none}#start{position:absolute;inset:0;background:linear-gradient(#05081488,#050814ed);display:flex;align-items:center;justify-content:center;pointer-events:auto}.panel{text-align:center;padding:24px;max-width:430px}.panel h1{font-size:clamp(34px,8vw,58px);line-height:.95;color:#ff334d;text-shadow:0 0 24px red;margin:0}.panel p{line-height:1.5;color:#dce0ec}button{border:0;border-radius:12px;padding:15px 30px;background:#f22f4a;color:white;font-size:18px;font-weight:900}@media(pointer:coarse){#pad,#jump{display:block}#bottom{bottom:8px}}
</style></head><body><div id="game"></div><div id="hud"><div class="top"><div class="pill">🪙 <span id="coins">0</span></div><div class="pill">⏱ <span id="time">60</span>s</div><div class="pill">🏆 <span id="score">0</span></div></div><div id="title">BEAST CHALLENGE ARENA</div><div id="message">Collect coins and avoid red hazard zones!</div><div id="bottom">WASD / arrows · SPACE to jump</div><div id="pad"><div id="stick"></div></div><button id="jump">JUMP</button></div><div id="start"><div class="panel"><h1>BEAST<br>CHALLENGE</h1><p>Explore a 3D arena, collect glowing coins, dodge danger zones and beat the clock.</p><button id="play">PLAY NOW</button><p style="font-size:12px">Solo 3D prototype · Online multiplayer not included yet</p></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x090d1b);scene.fog=new THREE.Fog(0x090d1b,22,65);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120),renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9db8ff,0x21101b,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-9,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const material=(c,r=.5,m=0,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:c,emissiveIntensity:e});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,70),material(0x202633,.8,.2));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(70,70,0x70283a,0x343b4a);grid.position.y=.02;scene.add(grid);
function cube(x,y,z,a,b,c,mat){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
const stone=material(0x303747,.6,.35),glow=material(0xff183f,.3,.2,2),dark=material(0x111827,.4,.5);
for(let i=0;i<32;i++){let a=i*Math.PI*2/32,x=Math.cos(a)*19,z=Math.sin(a)*19;o=cube(x,2,z,1.1,4,1.1,stone);o.lookAt(0,2,0);o=cube(x,4,z,1.15,.12,1.15,glow);o.lookAt(0,4,0)}
cube(0,3,-19,12,1,1,glow);cube(-5.5,1.5,-19,1,3,1,stone);cube(5.5,1.5,-19,1,3,1,stone);
const statue=new THREE.Group();statue.position.set(0,0,-24);scene.add(statue);let body=new THREE.Mesh(new THREE.SphereGeometry(2.2,18,14),stone);body.position.y=4;body.scale.set(1.1,1.5,.8);body.castShadow=true;statue.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(1.15,18,14),stone);head.position.y=6.1;head.castShadow=true;statue.add(head);for(let x of [-.55,.55]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.13,12,8),glow);eye.position.set(x,6.2,.98);statue.add(eye)}
for(let i=0;i<18;i++){let a=i*Math.PI*2/18,x=Math.cos(a)*15,z=Math.sin(a)*15;cube(x,1.2,z,.7,2.4,.7,dark);let l=new THREE.PointLight(0xff2449,2,8);l.position.set(x,2.7,z);scene.add(l)}
const player=new THREE.Group();scene.add(player);const skin=material(0xd8a17c),hood=material(0x10131d),pants=material(0x242a36),shoe=material(0xe7e9ef);
function part(x,y,z,a,b,c,m){let o=new THREE.Mesh(new THREE.BoxGeometry(a,b,c),m);o.position.set(x,y,z);o.castShadow=true;player.add(o)}
part(0,1.65,0,.85,.95,.48,hood);part(0,2.38,0,.62,.62,.58,hood);part(0,2.4,.31,.22,.17,.04,glow);part(-.55,1.65,0,.24,.9,.28,hood);part(.55,1.65,0,.24,.9,.28,hood);part(-.22,.58,0,.29,.95,.32,pants);part(.22,.58,0,.29,.95,.32,pants);part(-.22,.12,.12,.34,.22,.5,shoe);part(.22,.12,.12,.34,.22,.5,shoe);let face=new THREE.Mesh(new THREE.SphereGeometry(.34,16,12),skin);face.position.y=2.95;player.add(face);player.position.set(0,0,7);
const coins=[];for(let i=0;i<15;i++){let a=i*2.399,r=5+(i%4)*2,c=new THREE.Mesh(new THREE.TorusGeometry(.42,.13,10,24),material(0xffc83d,.2,.7,1.8));c.position.set(Math.cos(a)*r,.95,Math.sin(a)*r);scene.add(c);coins.push(c)}
const hazards=[];for(let i=0;i<5;i++){let a=i*1.256,h=new THREE.Mesh(new THREE.CylinderGeometry(1.35,1.35,.13,32),glow);h.position.set(Math.cos(a)*9,.12,Math.sin(a)*9);scene.add(h);hazards.push(h)}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0};const pad=document.querySelector('#pad'),stick=document.querySelector('#stick');function moveJoy(e){let r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,d=Math.hypot(x,y),max=36;if(d>max){x=x/d*max;y=y/d*max}joy={x:x/max,y:y/max};stick.style.transform=`translate(${x}px,${y}px)`}
pad.addEventListener('pointerdown',e=>{pad.setPointerCapture(e.pointerId);moveJoy(e)});pad.addEventListener('pointermove',e=>{if(e.buttons)moveJoy(e)});['pointerup','pointercancel'].forEach(n=>pad.addEventListener(n,()=>{joy={x:0,y:0};stick.style.transform=''}));
let vy=0,ground=true,got=0,score=0,time=60,playing=false;function jump(){if(ground&&playing){vy=8.5;ground=false}}document.querySelector('#jump').addEventListener('pointerdown',jump);
const ui={coins:document.querySelector('#coins'),score:document.querySelector('#score'),time:document.querySelector('#time'),msg:document.querySelector('#message')};document.querySelector('#play').onclick=()=>{document.querySelector('#start').style.display='none';playing=true;last=performance.now()};
function finish(msg){playing=false;ui.msg.textContent=msg;document.querySelector('#start').style.display='flex';document.querySelector('#start h1').innerHTML='CHALLENGE<br>COMPLETE';document.querySelector('.panel p').textContent=`Coins: ${got} · Score: ${score}`;document.querySelector('#play').textContent='PLAY AGAIN';document.querySelector('#play').onclick=()=>location.reload()}
let last=performance.now();function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.04);last=now;if(playing){time-=dt;if(time<=0){time=0;finish('Time is up!')}ui.time.textContent=Math.ceil(time);let x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,z=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y,l=Math.hypot(x,z);if(l>1){x/=l;z/=l}player.position.x=THREE.MathUtils.clamp(player.position.x+x*7*dt,-16,16);player.position.z=THREE.MathUtils.clamp(player.position.z+z*7*dt,-16,16);if(l>.08)player.rotation.y=Math.atan2(x,z);vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;ground=true}
coins.forEach(c=>{if(c.visible){c.rotation.y+=dt*2.8;c.position.y=.95+Math.sin(now*.003+c.position.x)*.14;if(c.position.distanceTo(new THREE.Vector3(player.position.x,player.position.y+1,player.position.z))<1.2){c.visible=false;got++;score+=100;ui.coins.textContent=got;ui.score.textContent=score;ui.msg.textContent='Great! +100 points'}}});
hazards.forEach(h=>{h.scale.setScalar(1+Math.sin(now*.004)*.08);if(Math.hypot(player.position.x-h.position.x,player.position.z-h.position.z)<1.45&&player.position.y<.7){score=Math.max(0,score-50);ui.score.textContent=score;player.position.x*=.94;player.position.z*=.94;ui.msg.textContent='Hazard! -50 points'}});if(got===coins.length)finish('You collected every coin!')}
camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+6,player.position.z+10),.09);camera.lookAt(player.position.x,player.position.y+1.2,player.position.z);renderer.render(scene,camera)}requestAnimationFrame(frame);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
